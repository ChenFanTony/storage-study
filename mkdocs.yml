# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Storage Study Knowledge Base
site_description: Curated notes on Linux, distributed, and AI storage systems
site_url: https://chenfantony.github.io/storage-study/
repo_url: https://github.com/ChenFanTony/storage-study
repo_name: ChenFanTony/storage-study
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.action.edit
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search

# Curated entry points keep the sidebar short. Individual lessons remain
# available through each track index and the site search.
nav:
  - Home: README.md
  - L1 · Single node:
      - Overview: L1-single-node/README.md
      - Kernel I/O: L1-single-node/kernel-io/day01-storage-stack-gap-fill.md
      - Memory: L1-single-node/memory/day01-physical-memory-model.md
      - Device Mapper: L1-single-node/device-mapper/README.md
      - Filesystems: L1-single-node/filesystems/filesystem-comparison-ext4-xfs-btrfs.md
      - SCSI: L1-single-node/scsi/day01.md
      - Networking: L1-single-node/network/day01_network_overview.md
      - SPDK: L1-single-node/spdk/study-index.md
      - Storage tiering: L1-single-node/storage-tiering/day08-bcache-gc-ssd-wear.md
  - L2 · Distributed:
      - Overview: L2-distributed/README.md
      - Consensus: L2-distributed/consensus/m2-day01-distributed-concepts.md
      - Placement and repair: L2-distributed/data-placement/m2-day08-14-erasure-placement.md
      - Protocols: L2-distributed/protocols/m2-day15-21-storage-protocols.md
      - Object storage: L2-distributed/object-storage/README.md
      - Ceph and other object stores: L2-distributed/systems/m2-day22-30-object-storage-review.md
      - DRBD: reference/drbd.md
      - DAOS: L2-distributed/systems/daos-architect-reference.md
  - L3 · Applications:
      - AI storage: L3-ai-storage/README.md
      - Cluster operations: L3-cluster-scheduling/README.md
  - Reference:
      - System guides:
          - Ceph services: reference/ceph.md
          - CephFS: reference/cephfs.md
          - Ceph object storage: reference/ceph-object-storage.md
          - DAOS quick guide: reference/daos.md
          - SPDK: reference/spdk.md
          - NVMe-oF: reference/nvme-of.md
      - Local storage:
          - Kernel storage: reference/kernel-storage.md
          - Filesystems: reference/filesystems.md
          - Tools: reference/tools-ecosystem.md
      - Design patterns:
          - All-flash architecture: architecture/all-flash-architecture.md
          - Cache design: architecture/cache-design/cache-design-patterns.md
          - I/O latency: architecture/io-latency-cost-model.md
      - Topic indexes:
          - Devices: categories/devices.md
          - Filesystems: categories/filesystems.md
          - SPDK: categories/spdk.md

exclude_docs: |
  _meta/
